[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safesql-mcp"
version = "1.1.0"
description = "SafeSQL MCP: AI Agent safe database access MCP Server + SQL risk audit tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Panda", email = "315337987@qq.com"},
]
maintainers = [
    {name = "Panda", email = "315337987@qq.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Framework :: AsyncIO",
]
keywords = ["mcp", "sql", "database", "ai-agent", "security", "postgresql", "mysql", "oracle", "model-context-protocol"]

dependencies = [
    "mcp>=1.0.0",
    "sqlglot>=20.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "oracledb>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
]
oracle = [
    "oracledb>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mapan0424/safesql-mcp"
Documentation = "https://github.com/mapan0424/safesql-mcp/wiki"
Repository = "https://github.com/mapan0424/safesql-mcp"
Issues = "https://github.com/mapan0424/safesql-mcp/issues"
Changelog = "https://github.com/mapan0424/safesql-mcp/blob/main/CHANGELOG.md"

[project.scripts]
safesql-mcp = "safesql_mcp.server:main"
safesql-review = "safesql_mcp.cli:review"

[tool.hatch.build.targets.wheel]
packages = ["src/safesql_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/safesql_mcp",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=safesql_mcp --cov-report=term-missing"